<div class="diary-modal-overlay" id="diaryHistoryOverlay" aria-hidden="true" hidden>
    <section class="diary-modal diary-history-modal" role="dialog" aria-modal="true" aria-labelledby="diaryHistoryModalTitle">
        <header class="diary-modal-header">
            <div>
                <p class="diary-eyebrow">AUDIT TRAIL</p>
                <h2 id="diaryHistoryModalTitle">Entry history</h2>
            </div>
            <button type="button" class="diary-modal-close" data-diary-close="diaryHistoryOverlay" aria-label="Close dialog"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div class="diary-history-content" id="diaryHistoryContent">
            <p class="diary-muted">Loading history…</p>
        </div>
        <footer class="diary-modal-footer">
            <button type="button" class="diary-button diary-button-secondary" data-diary-close="diaryHistoryOverlay">Close</button>
        </footer>
    </section>
</div>
