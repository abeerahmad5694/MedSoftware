{% comment %} <!-- ═══════ GLOBAL ACCOUNT MODAL ═══════ -->
<!-- Include this in any template: {% include 'myaccounts/global_account_form_modal.html' %} -->
<!-- Then call: openAccountModal('10000001') or openAccountModal() for blank -->  {% endcomment %}
{% load static %}
<link rel="stylesheet" href="{% static 'myaccounts/css/global_account_form_modal.css' %}">
<div id="accModal" class="acc-modal-overlay" style="display:none;">
    <div class="acc-modal">

        <!-- Header -->
        <div class="acc-modal__header">
            <div class="acc-modal__title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4a2 2 0 0 1 2-2h8.5L20 7.5V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/><polyline points="14 2 14 8 20 8"/></svg>
                <span id="accModalTitle">Account Details</span>
            </div>
            <button type="button" class="acc-modal__close" id="accModalClose" title="Close">&times;</button>
        </div>

        <!-- Body -->
        <div class="acc-modal__body">
            <div class = 'hidden' style ='display:none;'>
                <input type="hidden" class = 'acc-modal__input' id = 'accm_UPDATE_OR_CREATE'>
                <input type="hidden" class = 'acc-modal__input' id = 'accm_TYPE'>
                <input type="hidden" class = 'acc-modal__input' id = 'accm_CLASS_FIELD'>
                <input type="hidden" class = 'acc-modal__input' id = 'accm_LEVEL'>
                
                
            </div>
            <!-- Status message area -->
            <div id="accModalMsg" class="acc-modal__msg" style="display:none;"></div>

            <!-- Row 1: Identity -->
            <div class="acc-modal__section-label">Identity</div>
            <div class="acc-modal__row">
                <div class="acc-modal__field">
                    <label>Code</label>
                    <input type="number" id="accm_ACC_CODE" class="acc-modal__input" readonly>
                </div>
                <div class="acc-modal__field acc-modal__field--wide">
                    <label>Name</label>
                    <input type="text" id="accm_ACC_NAME" class="acc-modal__input" maxlength="70">
                </div>
                <div class="acc-modal__field"  style = 'display:none;'>
                    <label>Salesman</label>
                    <input type="text" id="accm_SALESMAN" class="acc-modal__input" maxlength="25">
                </div>
            </div>
            <div name = 'showOnlyName' id = 'showOnlyName' >
            <!-- Row 2: Contact -->
            <div class="acc-modal__section-label">Contact</div>
            <div class="acc-modal__row">
                <div class="acc-modal__field">
                    <label>Mobile</label>
                    <input type="text" id="accm_MOBILE_NO" class="acc-modal__input" maxlength="40">
                </div>
                <div class="acc-modal__field">
                    <label>Phone (Off)</label>
                    <input type="text" id="accm_PHONE_OFF" class="acc-modal__input" maxlength="30">
                </div>
                <div class="acc-modal__field acc-modal__field--wide">
                    <label>Email</label>
                    <input type="email" id="accm_EMAIL_ADDRESS" class="acc-modal__input" maxlength="40">
                </div>
            </div>

            <!-- Row 3: Address -->
            <div class="acc-modal__section-label">Address</div>
            <div class="acc-modal__row">
                <div class="acc-modal__field acc-modal__field--wide">
                    <label>Address</label>
                    <input type="text" id="accm_ADDRESS" class="acc-modal__input" maxlength="80">
                </div>
                <div class="acc-modal__field">
                    <label>City</label>
                    <input type="text" id="accm_CITY" class="acc-modal__input" maxlength="20">
                </div>
                <div class="acc-modal__field">
                    <label>Country</label>
                    <input type="text" id="accm_COUNTRY" class="acc-modal__input" maxlength="45">
                </div>
            </div>

            <!-- Row 4: Financial + Tax -->
            <div class="acc-modal__section-label">Financial &amp; Tax</div>
            <div class="acc-modal__row">
                <div class="acc-modal__field">
                    <label>Opening Bal.</label>
                    <input type="number" id="accm_OPENING_BALANCE" class="acc-modal__input" step="0.01">
                </div>
                <div class="acc-modal__field">
                    <label>Bal. Type</label>
                    <input type="text" id="accm_BALANCE_TYPE" class="acc-modal__input" maxlength="2">
                </div>
                <div class="acc-modal__field">
                    <label>Credit Limit</label>
                    <input type="number" id="accm_CREDIT_LIMIT" class="acc-modal__input">
                </div>
                <div class="acc-modal__field">
                    <label>NTN No.</label>
                    <input type="text" id="accm_NTN_NO" class="acc-modal__input" maxlength="35">
                </div>
            </div>

            <div class="acc-modal__row">
                <div class="acc-modal__field">
                    <label>STN No.</label>
                    <input type="text" id="accm_STN_NO" class="acc-modal__input" maxlength="35">
                </div>
                <div class="acc-modal__field acc-modal__field--wide">
                    <label>Remarks</label>
                    <input type="text" id="accm_REMARKS" class="acc-modal__input" maxlength="200">
                </div>
                <div class="acc-modal__field">
                    <label>Password</label>
                    <input type="password" id="accm_PASSWORD" class="acc-modal__input" maxlength="10">
                </div>
                <div class="acc-modal__field acc-modal__field--checkbox">
                    <label>Locked</label>
                    <input type="checkbox" id="accm_LOCKED" class="acc-modal__checkbox">
                </div>
            </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="acc-modal__footer">
            <button type="button" class="acc-modal__btn acc-modal__btn--save" id="accModalSave">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Save
            </button>
            <button type="button" class="acc-modal__btn acc-modal__btn--cancel" id="accModalCancel">Cancel</button>
        </div>

    </div>
</div>
<!-- <script type="module" src="{% static 'myaccounts/js/account_utils.js' %}"></script> -->
<script type="module" src="{% static 'myaccounts/js/modals/global_account_form_modal.js' %}"></script>
