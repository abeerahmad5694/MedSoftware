{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enterprise ERP Core</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/font-awesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/inter/inter.css' %}">
</head>
<body class="flex items-center justify-center min-h-screen bg-[var(--bg-canvas)]">

    <div class="w-full max-w-sm p-8 m-4 rounded-xl shadow-lg border border-[var(--border-color)] surface flex flex-col items-center">
        <!-- Logo -->
        <div class="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-white text-xl mb-4 shadow-sm" style="background:var(--accent-indicator);">
            E
        </div>
        <h1 class="text-2xl font-bold text-[var(--text-main)] mb-1 text-center">Welcome Back</h1>
        <p class="text-xs text-[var(--text-muted)] mb-6 text-center">Sign in to access your Enterprise ERP workspace.</p>

        <!-- Form -->
        <form method="post" action="{% url 'login' %}" class="w-full space-y-4">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="p-3 text-xs text-red-600 bg-red-50 rounded-lg border border-red-200">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}

            <div>
                <label for="id_username" class="block text-[0.625rem] font-bold text-[var(--text-muted)] mb-1 uppercase tracking-wider">Username</label>
                <input type="text" name="username" id="id_username" required autofocus class="w-full border border-[var(--border-color)] rounded-lg px-3 py-2 bg-transparent text-sm text-[var(--text-main)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition">
            </div>

            <div>
                <label for="id_password" class="block text-[0.625rem] font-bold text-[var(--text-muted)] mb-1 uppercase tracking-wider flex justify-between">
                    Password
                    <a href="#" class="text-[var(--color-primary)] hover:underline capitalize normal-case text-xs font-semibold tracking-normal">Forgot?</a>
                </label>
                <input type="password" name="password" id="id_password" required class="w-full border border-[var(--border-color)] rounded-lg px-3 py-2 bg-transparent text-sm text-[var(--text-main)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition">
            </div>

            <button type="submit" class="btn btn-primary w-full mt-2 py-2.5 shadow hover:shadow-md transition">
                Sign In <i class="fa-solid fa-arrow-right-to-bracket ml-1 text-[10px]"></i>
            </button>
        </form>
    </div>

</body>
</html>
